name: Release Windows and macOS apps

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-release-preflight:
    # Do this before the Windows job publishes a release. A package failure on
    # macOS must not turn a Windows-only bundle into the project's latest
    # release when the public product promise includes both platforms.
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - name: Build and scan unsigned universal macOS package
        run: npm run dist:mac
        env:
          # On hosted runners an empty signing configuration may be interpreted
          # as a path and fail with "not a file". A supplied CSC_LINK still
          # selects the explicit certificate in the final release job.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node desktop/verify-package.js dist-desktop/mac-universal

  windows-release:
    runs-on: windows-latest
    needs: macos-release-preflight
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json -Raw | ConvertFrom-Json).version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Build installer and updater metadata
        run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Block secrets and forbidden files in installer payload
        run: node desktop/verify-package.js dist-desktop/win-unpacked

      - name: Build and verify portable package
        run: npm run dist:win-packager

      - name: Assemble release assets and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "dist-desktop/Fama-Setup-$version.exe"
          Copy-Item $installer.FullName 'dist-desktop/Fama-Setup.exe' -Force
          Compress-Archive -Path 'dist-desktop/Fama-win32-x64/*' -DestinationPath 'dist-desktop/Fama-win32-x64.zip' -Force

          npm sbom --sbom-format cyclonedx | Out-File 'dist-desktop/fama-sbom.cdx.json' -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed.' }

          $assets = @(
            $installer.FullName,
            (Resolve-Path 'dist-desktop/Fama-Setup.exe').Path,
            (Resolve-Path 'dist-desktop/Fama-win32-x64.zip').Path,
            (Resolve-Path 'dist-desktop/latest.yml').Path,
            (Get-Item "dist-desktop/Fama-Setup-$version.exe.blockmap").FullName,
            (Resolve-Path 'dist-desktop/fama-sbom.cdx.json').Path
          )
          $lines = $assets | Sort-Object | ForEach-Object {
            $file = Get-Item $_
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($file.Name)"
          }
          $lines | Set-Content 'dist-desktop/SHA256SUMS.txt' -Encoding utf8

      - name: Create signed build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist-desktop/Fama-Setup-*.exe
            dist-desktop/Fama-Setup.exe
            dist-desktop/Fama-win32-x64.zip

      - name: Create signed SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.0.0
        with:
          subject-path: |
            dist-desktop/Fama-Setup-*.exe
            dist-desktop/Fama-Setup.exe
            dist-desktop/Fama-win32-x64.zip
          sbom-path: dist-desktop/fama-sbom.cdx.json

      - name: Publish verified release bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            (Resolve-Path "dist-desktop/Fama-Setup-$version.exe").Path,
            (Resolve-Path "dist-desktop/Fama-Setup-$version.exe.blockmap").Path,
            (Resolve-Path 'dist-desktop/Fama-Setup.exe').Path,
            (Resolve-Path 'dist-desktop/Fama-win32-x64.zip').Path,
            (Resolve-Path 'dist-desktop/latest.yml').Path,
            (Resolve-Path 'dist-desktop/fama-sbom.cdx.json').Path,
            (Resolve-Path 'dist-desktop/SHA256SUMS.txt').Path
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title "Fama v$version" --notes-file CHANGELOG.md --latest
          } else {
            gh release create $tag @assets --title "Fama v$version" --notes-file CHANGELOG.md --latest --verify-tag
          }

  macos-release:
    runs-on: macos-latest
    needs: windows-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi

      - name: Build universal macOS DMG and updater zip
        run: npm run dist:mac
        env:
          # Keep the public release unsigned until real Developer ID
          # credentials are supplied. Passing an empty CSC_LINK makes
          # electron-builder treat the workspace directory as a certificate
          # path and fail instead of producing the documented unsigned build.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Block secrets and forbidden files in macOS payload
        run: node desktop/verify-package.js dist-desktop/mac-universal

      - name: Assemble stable aliases and combined checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          versioned_dmg="dist-desktop/Fama-${version}-macOS-universal.dmg"
          versioned_zip="dist-desktop/Fama-${version}-macOS-universal.zip"
          cp "$versioned_dmg" dist-desktop/Fama-macOS-universal.dmg
          cp "$versioned_zip" dist-desktop/Fama-macOS-universal.zip

          mkdir -p dist-desktop/release-base
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --pattern fama-sbom.cdx.json --dir dist-desktop/release-base

          mac_assets=(
            "$versioned_dmg"
            "$versioned_zip"
            dist-desktop/Fama-macOS-universal.dmg
            dist-desktop/Fama-macOS-universal.zip
            dist-desktop/latest-mac.yml
          )
          if [[ -f "${versioned_zip}.blockmap" ]]; then
            mac_assets+=("${versioned_zip}.blockmap")
          fi
          : > dist-desktop/MAC-SHA256SUMS.txt
          for asset in "${mac_assets[@]}"; do
            hash="$(shasum -a 256 "$asset" | awk '{print $1}')"
            printf '%s *%s\n' "$hash" "$(basename "$asset")" >> dist-desktop/MAC-SHA256SUMS.txt
          done
          cat dist-desktop/release-base/SHA256SUMS.txt dist-desktop/MAC-SHA256SUMS.txt | sort -k2 > dist-desktop/SHA256SUMS.txt

      - name: Create signed macOS build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist-desktop/Fama-*-macOS-universal.dmg
            dist-desktop/Fama-*-macOS-universal.zip
            dist-desktop/Fama-macOS-universal.dmg
            dist-desktop/Fama-macOS-universal.zip

      - name: Create signed macOS SBOM attestation
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.0.0
        with:
          subject-path: |
            dist-desktop/Fama-*-macOS-universal.dmg
            dist-desktop/Fama-*-macOS-universal.zip
            dist-desktop/Fama-macOS-universal.dmg
            dist-desktop/Fama-macOS-universal.zip
          sbom-path: dist-desktop/release-base/fama-sbom.cdx.json

      - name: Add macOS app to the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          assets=(
            "dist-desktop/Fama-${version}-macOS-universal.dmg"
            "dist-desktop/Fama-${version}-macOS-universal.zip"
            dist-desktop/Fama-macOS-universal.dmg
            dist-desktop/Fama-macOS-universal.zip
            dist-desktop/latest-mac.yml
            dist-desktop/SHA256SUMS.txt
          )
          if [[ -f "dist-desktop/Fama-${version}-macOS-universal.zip.blockmap" ]]; then
            assets+=("dist-desktop/Fama-${version}-macOS-universal.zip.blockmap")
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
