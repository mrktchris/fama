name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The source server supports Node 18 without development dependencies.
      # Current Electron build tooling requires Node 22.12+, so only the
      # Node 22 lane installs the complete development toolchain.
      - run: npm ci --omit=dev
        if: matrix.node == 18
      # Electron 43's development package requires Node >=22.12. The Node 18
      # lane validates the dependency-light server/runtime contract without
      # installing desktop build tooling that cannot run on that Node line.
      - run: npm ci --omit=dev
        if: matrix.node == 18
      - run: npm ci
        if: matrix.node != 18
        if: matrix.node == 22
      - run: npm test
      - run: npm audit --audit-level=high
        if: matrix.node == 22

  windows-package:
    name: Windows package build + secret scan
    runs-on: windows-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The real reason this job exists: verify-package.js is the gate that
      # would have caught the v0.12.0 leak (stray dev logs shipped in a
      # release zip) before upload, not after. Running it in CI on every
      # push means a build from a clean checkout is scanned automatically,
      # not only when someone remembers to run it by hand locally.
      - run: npm run dist:win-packager
      - run: npm run verify-package
      # dist:win-packager produces a folder, not a zip (zipping for an
      # actual release is a separate, manual step); upload-artifact zips a
      # directory automatically for download, no extra step needed here.
      - uses: actions/upload-artifact@v4
        with:
          name: fama-win32-x64
          path: dist-desktop/Fama-win32-x64
          retention-days: 7

  windows-installer:
    # Real NSIS installer via electron-builder, the path that's blocked
    # locally by this project's own dev environment (a Developer-Mode /
    # symlink-creation permission wall electron-builder's winCodeSign step
    # hits, documented in README's Known limitations). GitHub's own runners
    # don't carry that restriction, that's the whole reason this job exists
    # instead of just running the same command locally.
    #
    # Signing: electron-builder auto-detects the CSC_LINK (base64 .pfx or a
    # path to one) and CSC_KEY_PASSWORD secrets if they're set and signs the
    # installer automatically, no code change needed here to turn that on.
    # Without them it builds a real, working, unsigned installer, same as
    # today, still real progress: an installer beats "unzip and run" even
    # unsigned, and SmartScreen's warning is the same either way until a
    # cert exists. Obtaining an actual code-signing certificate needs a real
    # purchase and identity verification from a CA (or Microsoft's Trusted
    # Signing service), which only the repo owner can do, not something any
    # CI config can substitute for.
    name: Windows installer (NSIS)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fama-installer-nsis
          path: dist-desktop/*.exe
          retention-days: 7
          if-no-files-found: warn
