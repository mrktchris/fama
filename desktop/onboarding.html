<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fama setup</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1a1510; --panel: #221b13; --border: #3a2f1f; --text: #f4eee1;
    --muted: #b6ac99; --muted-2: #7d7565; --accent: #b9853f; --accent-glow: rgba(185, 133, 63, .35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", -apple-system, sans-serif; padding: 22px;
    display: flex; flex-direction: column; height: 100vh;
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.5; }
  #list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .project-option {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; font-size: 12.5px; display: flex; align-items: flex-start; gap: 10px;
  }
  .project-option:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
  .project-option.checked { border-color: var(--accent); background: rgba(185, 133, 63, 0.08); }
  .project-option input[type="checkbox"] { margin-top: 2px; accent-color: var(--accent); flex: 0 0 auto; }
  .project-option .text { min-width: 0; }
  .project-option .path { font-weight: 600; word-break: break-all; }
  .project-option .meta { color: var(--muted-2); font-size: 11px; margin-top: 3px; }
  #empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 30px 10px; }
  #browse, #continue {
    margin-top: 10px; padding: 9px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 12.5px;
  }
  #browse:hover { border-color: var(--muted-2); }
  #continue { background: var(--accent); color: #170f08; border-color: var(--accent); font-weight: 700; }
  #continue:disabled { background: var(--panel); color: var(--muted-2); border-color: var(--border); cursor: default; font-weight: 400; }
</style>
</head>
<body>
  <h1>Which project(s) should this watch?</h1>
  <p class="sub">Claude Code sessions found on this machine, most recently active first. Check as many as you want, Fama can watch several at once. This only shows what's already running, nothing about your work is sent anywhere.</p>
  <div id="list"><div id="empty">Looking…</div></div>
  <button id="browse" type="button">Browse for a different folder…</button>
  <button id="continue" type="button" disabled>Continue</button>
  <script src="onboarding.js"></script>
</body>
</html>
