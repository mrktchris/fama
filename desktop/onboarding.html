<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fama setup</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #050713; --panel: rgba(18,23,42,.86); --border: rgba(189,209,255,.13); --text: #f6f8ff;
    --muted: #aab3cc; --muted-2: #6f7893; --accent: #7083ff; --accent-glow: rgba(100,122,255,.34);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--text);
    background: radial-gradient(circle at 20% -10%, rgba(82,108,255,.28), transparent 44%), var(--bg);
    font-family: "Segoe UI", -apple-system, sans-serif; padding: 22px 24px 24px;
    display: flex; flex-direction: column; height: 100vh;
  }
  .setup-brand { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; margin-bottom: 18px; }
  .setup-brand img { width: 30px; height: 30px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  h1 { font-size: 19px; letter-spacing: -.02em; margin: 0 0 5px; }
  p.sub { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; line-height: 1.55; }
  #list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; padding: 1px; }
  .project-option {
    background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
    padding: 11px 12px; cursor: pointer; text-align: left; color: var(--text);
    font-family: inherit; font-size: 12.5px; display: flex; align-items: flex-start; gap: 10px;
    transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .project-option:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 12px 28px rgba(0,0,0,.22); }
  .project-option.checked { border-color: var(--accent); background: rgba(112,131,255,.12); box-shadow: inset 0 0 0 1px var(--accent-glow); }
  .project-option input[type="checkbox"] { margin-top: 2px; accent-color: var(--accent); flex: 0 0 auto; }
  .project-option .text { min-width: 0; }
  .project-option .path { font-weight: 600; word-break: break-all; }
  .project-option .meta { color: var(--muted-2); font-size: 11px; margin-top: 3px; }
  #empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 30px 10px; }
  #browse, #continue {
    margin-top: 10px; padding: 10px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 12.5px; transition: transform .18s ease, border-color .18s ease;
  }
  #browse:hover { border-color: var(--muted-2); transform: translateY(-1px); }
  #continue { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  #continue:disabled { background: var(--panel); color: var(--muted-2); border-color: var(--border); cursor: default; font-weight: 400; }
  #clear-projects { background: transparent; color: var(--muted); border-color: var(--border); }
  #clear-projects:hover { color: var(--error, #ff7794); border-color: var(--error, #ff7794); }
</style>
</head>
<body>
  <div class="setup-brand"><img src="../viewer/identity-signal.png" alt=""><span>Fama</span></div>
  <h1>Choose the conversations to follow</h1>
  <p class="sub">Select one or more projects with Claude Code activity. Fama keeps the live message feed on this computer and only sends text out when you explicitly configure cloud narration.</p>
  <div id="list"><div id="empty">Looking…</div></div>
  <button id="browse" type="button">Browse for a different folder…</button>
  <button id="continue" type="button" disabled>Continue</button>
  <button id="clear-projects" type="button">Clear all watched projects</button>
  <script src="onboarding.js"></script>
</body>
</html>
